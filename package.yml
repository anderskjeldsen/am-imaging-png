
id: am-imaging-png
version: 1.0.0
type: library
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
#    branch: master
    url: https://github.com/anderskjeldsen/am-lang-core.git
  - id: am-imaging
    realm: github
    type: git-repo
    tag: latest
#    branch: master
    url: https://github.com/anderskjeldsen/am-imaging.git
platforms:
  - id: libc
    abstract: true
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    asmCommand: vasmm68k_mot
    gccAdditionalLibraries:
      - socket
      - png
      - z
      - m
    additionalHeaders:
    additionalAsmSources:
    additionalCSources:
    additionalIncludePaths:
    gccAdditionalOptions:
      - -noixemul     
  - id: macos-arm
    extends: libc
    gccCommand: gcc
    gccAdditionalLibraries:
      - png16
    additionalHeaders:
    additionalAsmSources:
    additionalCSources:
    additionalIncludePaths:
      - /opt/homebrew/include
#    gccAdditionalOptions:
#      - -L /opt/homebrew/lib
#      - -l png
    gccLibraryPaths:
      - /opt/homebrew/lib
  # Windows (MinGW-w64): static libpng + zlib from MSYS2's mingw64 packages,
  # unpacked in ../windows-deps/msys2.
  - id: windows-x64
    extends: libc
    gccCommand: x86_64-w64-mingw32-gcc -O2
    gccAdditionalOptions:
      - -I/Users/anderskjeldsen/Projects/AmLang/windows-deps/msys2/mingw64/include
    gccLibraryPaths:
      - /Users/anderskjeldsen/Projects/AmLang/windows-deps/msys2/mingw64/lib
    gccAdditionalLibraries:
      - png16
      - z
  # 32-bit Windows / ReactOS: MSYS2's mingw32 (msvcrt) libpng + zlib.
  - id: windows-x86
    extends: windows-x64
    gccCommand: i686-w64-mingw32-gcc -O2
    gccLibraryPaths:
      - /Users/anderskjeldsen/Projects/AmLang/windows-deps/msys2/mingw32/lib
    gccAdditionalLibraries:
      # MSYS2 builds them with -fstack-protector: __stack_chk_* live in libssp.
      - png16
      - z
      - ssp
  - id: linux-x64
    extends: libc
    gccCommand: gcc
    # libpng must be on the link line (GNU ld: an object referencing
    # png_set_sig_bytes needs -lpng16 explicitly, or the link fails with
    # "DSO missing from command line"). gccAdditionalLibraries places the
    # -l flag after the objects, which is what GNU ld's link ordering wants.
    gccAdditionalLibraries:
      - png16
  - id: linux-ppc32
    extends: libc
    gccCommand: powerpc-linux-gnu-gcc -O1
    gccAdditionalOptions:
      - -pthread
    gccAdditionalLibraries:
      - png16
    additionalHeaders:
    additionalAsmSources:
    additionalCSources:
    additionalIncludePaths:
    gccLibraryPaths:
  - id: linux-ppc64
    extends: linux-ppc32
    gccCommand: powerpc-linux-gnu-gcc -O2
  # GameCube/Wii. Without libpng the loader throws (see PngLoader.c); an
  # app that defines AM_PNG_HAVE_LIBPNG and links png16 + z from devkitPro's
  # portlibs gets the normal libpng loader -- the portlibs include path is
  # here because include paths apply per package.
  - id: nintendo-ppc
    extends: libc
    gccCommand: "powerpc-eabi-gcc -O2 -mogc -mcpu=750 -meabi -mhard-float"
    additionalIncludePaths:
      - /opt/devkitpro/libogc2/gamecube/include
      - /opt/devkitpro/portlibs/ppc/include
    gccAdditionalOptions:
      - -DAM_PLATFORM_NINTENDO_PPC
      - -DGEKKO
  # Nintendo 3DS: devkitPro's portlibs libpng (in devkitpro/devkitarm).
  - id: nintendo-3ds
    extends: libc
    gccCommand: arm-none-eabi-gcc -O2 -march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -mword-relocations -ffunction-sections -fdata-sections
    gccAdditionalOptions:
      - -D__3DS__
      - -I/opt/devkitpro/portlibs/3ds/include
    gccLibraryPaths:
      - /opt/devkitpro/portlibs/3ds/lib
    # m after png16: GNU ld resolves left to right, and libpng calls pow().
    gccAdditionalLibraries:
      - png16
      - z
      - m
  - id: morphos-ppc
    extends: libc
    gccCommand: ppc-morphos-gcc -O3
    # MorphOS ships libpng as png.library (a shared-library wrapper
    # around libpng 1.2.59). Defining __MORPHOS_SHAREDLIBS in the
    # bundled <png.h> wrapper switches it from `#include_next <png.h>`
    # (which would look for a host libpng we don't have) to the
    # PNGBase-dispatched API; -lpng_shared and -lz_shared then resolve
    # the stubs to png.library / z.library calls.
    gccAdditionalLibraries:
      - png_shared
      - z_shared
      - m
    additionalHeaders:
    additionalAsmSources:
    additionalCSources:
    additionalIncludePaths:
    gccAdditionalOptions:
      - -noixemul
      - -D__MORPHOS_SHAREDLIBS
    gccLibraryPaths:

  # Shared AROS base (all architectures) — see am-lang-core's `aros`.
  - id: aros
    abstract: true
    extends: libc
    gccAdditionalLibraries:
      # AROS ships plain libpng/libz (the *_shared names are MorphOS-only).
      - png
      - z
      - m

  - id: aros-arm64
    extends: aros
    gccCommand: aarch64-aros-gcc -O2
    gccAdditionalOptions:
      - -fno-common   # AROS's loader REFUSES COMMON symbols; gcc 6.5.0 defaults to -fcommon
      - -D_REENTRANT  # aarch64-aros-gcc rejects -pthread outright
    additionalLinkerFlags:
      - -lpthread     # no driver links it without -pthread, which AROS gcc rejects
buildTargets:
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc
      buildPath: /host
  - id: amigaos_docker_arm
    platform: amigaos
    dockerBuild:
      image: kjeldsenanders/dnf-dev:initial
      buildPath: /host
  - id: macos-arm
    platform: macos-arm
    commands:
      - make -f macos-arm.Makefile all
  - id: linux-x64
    platform: linux-x64
